name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build
        shell: pwsh
        run: ./scripts/Test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: paper-chat-for-zotero
          path: dist/paper-chat-for-zotero.xpi
